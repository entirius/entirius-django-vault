[project]
name = "entirius-django-vault"
version = "2.0.0"
description = "Customer payment-card vault with PayU tokenized cards behind an X-API-KEY REST API"
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "django>=5.0",
    "marshmallow>=3.19",
    "marshmallow-dataclass>=8.5",
    "entirius-django-accounts>=5.0.0",
    "entirius-django-utils>=2.0.0",
    "entirius-py-bievents>=2.0.0",
    "entirius-py-payu-sdk>=2.0.0",
    "entirius-py-process-logger>=2.0.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = [
    "pytest",
    "pytest-django",
    # django_accounts URLconf pulls verify_captcha (lazy django_captcha import in django_utils);
    # tests boot with django_captcha in INSTALLED_APPS, mirroring entirius-django-accounts' own tests.
    "entirius-django-captcha>=2.0.0",
]

[project.urls]
Repository = "https://github.com/entirius/entirius-django-vault"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_vault"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105"]
# Legacy migrated 1:1 — pre-existing lint debt, tracked outside this repo; do not grow these lists.
"src/django_vault/views/vault_api.py" = ["B904"]

[tool.ruff.lint.isort]
known-first-party = ["django_vault"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]

[tool.deptry.per_rule_ignores]
# No Python import of django_accounts (FK "django_accounts.Customer" is a string reference), but
# migration 0001 depends on django_accounts.0017 — the >=5.0.0 constraint must stay explicit.
DEP002 = ["entirius-django-accounts"]
